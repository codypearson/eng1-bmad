# Team override — ENG1 quick-dev (same delivery rules as bmad-dev-story)
# Committed; applies to everyone using this BMAD control-plane repo.

[workflow]
persistent_facts = [
  "file:{project-root}/_bmad/custom/eng1-dev-delivery-facts.md",
]

on_complete = "Confirm: (1) Development subtask is Done; (2) Code Review subtask exists under the story/ticket with developer-centric testing instructions and remains To Do; (3) Stakeholder Review was handled per user decision — either exists To Do with simple non-technical testing instructions, or was deleted/not created; (4) Deploy subtask exists, typed as Deploy, Release Notes set, description only if manual intervention is needed, and remains To Do; (5) git branch is the lowercased ticket key, based on trunk (main/master detected) or the previous story branch as required; (6) changes were committed, pushed, and a PR was opened via GitHub MCP (or gh CLI fallback) with the Jira ticket number in the title. Report Jira keys, branch name, and PR URL before exiting."
